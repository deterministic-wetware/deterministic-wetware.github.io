<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deterministic Wetware</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Instrument+Serif:ital@1&display=swap">
  <style>
    :root {
      --text: #111;
      --text-muted: #555;
      --text-faint: #777;
      --border: #e6e6e6;
      --image-bg: #f7f6f3;
      --bg: #fff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      display: grid;
      grid-template-columns: 290px 1fr;
      max-width: 1100px;
      margin: 0 auto;
      padding: 56px 24px;
      min-height: 100vh;
    }

    /* Left column: site title, tagline and navigation. */

    .sidebar {
      padding: 40px 32px 0 24px;
      border-right: 1px solid var(--border);
    }

    .site-title {
      margin: 0;
      font-size: 36px;
      line-height: 1.05;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .site-title em {
      display: block;
      padding-left: 2px;
      font-family: "Instrument Serif", Georgia, serif;
      font-style: italic;
      font-weight: 400;
      font-size: 48px;
      letter-spacing: 0;
    }

    .tagline {
      margin: 22px 0 0;
      font-size: 14px;
      line-height: 1.45;
      color: var(--text-muted);
    }

    .tagline::after {
      content: "";
      display: block;
      width: 58px;
      margin-top: 22px;
      border-bottom: 1px solid var(--border);
    }

    .nav-section {
      margin: 32px 0 0;
      font-size: 15px;
      font-weight: 400;
      color: var(--text);
    }

    .nav-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .nav-list li {
      margin-top: 10px;
    }

    .nav-list a {
      font-size: 15px;
      color: var(--text-faint);
      transition: color 0.15s;
    }

    .nav-list a:hover {
      color: var(--text);
    }

    /* Content columns: article cards. */

    .cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 56px;
      align-content: start;
      padding: 40px 0 0 58px;
    }

    .card-image {
      display: flex;
      align-items: center;
      justify-content: center;
      aspect-ratio: 330 / 172;
      background: var(--image-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
    }

    .card-image img {
      width: 128px;
      height: 128px;
      transition: transform 0.3s;
    }

    .card:hover .card-image img {
      transform: scale(1.06);
    }

    .card-category {
      margin: 16px 0 0;
      font-size: 12px;
      color: var(--text-muted);
    }

    .card-title {
      margin: 6px 0 0;
      font-size: 23px;
      line-height: 1.25;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .card:hover .card-title {
      text-decoration: underline;
      text-underline-offset: 3px;
      text-decoration-thickness: 1px;
    }

    .card-text {
      margin: 10px 0 0;
      font-size: 16px;
      line-height: 1.45;
      color: var(--text-muted);
    }

    @media (max-width: 760px) {
      .page {
        grid-template-columns: minmax(0, 1fr);
        align-content: start;
        padding: 32px 16px;
      }

      .sidebar {
        padding: 0 0 32px;
        border-right: none;
        border-bottom: 1px solid var(--border);
      }

      .cards {
        grid-template-columns: 1fr;
        padding: 32px 0 0;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <aside class="sidebar">
      <h1 class="site-title">Deterministic <em>Wetware</em></h1>
      <p class="tagline">AI Explorations</p>
      <nav>
        <h2 class="nav-section">Games</h2>
        <ul class="nav-list">
          <li><a href="ai-defender/index.html">AI Defender</a></li>
        </ul>
      </nav>
    </aside>

    <main class="cards">
      <a class="card" href="ai-defender/index.html">
        <div class="card-image">
          <img src="images/ai-defender.png" alt="AI Defender ship">
        </div>
        <p class="card-category">Games</p>
        <h3 class="card-title">AI Defender</h3>
        <p class="card-text">A web game developed using AI inspired by the original arcade game</p>
      </a>
    </main>
  </div>
</body>
</html>
